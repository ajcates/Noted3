# noted — design tokens (M5, spec.md §12)
#
# Edit this file and reload the browser — no rebuild, no restart. The server
# recompiles it into /theme.css on every request (src/theme.ts).
#
# This file is optional: delete it (or point THEME_PATH somewhere that
# doesn't exist) and the built-in Material 3 Expressive default applies,
# which is exactly what's written out below. Every key below is also
# optional — anything you leave out falls back to the same default, and any
# key that isn't recognized is silently ignored rather than breaking the app
# (same tolerance as a hand-written note with missing frontmatter).
#
# The schema below IS the M3 Expressive vocabulary — there's no raw-CSS
# escape hatch. Four seed colors, three font families, the fixed 15-role
# type scale, the fixed shape scale, the two named motion schemes, and a
# small set of layout placements. Elevation is deliberately not here: M3
# Expressive as designed for this app uses no drop-shadows at all, only the
# surface-container tonal steps below.
#
# --- The easy path: just change the four seed colors ---
# Give a color role only a `seed` (lightness %, chroma, hue — OKLCH) and its
# on-color / container / on-container are derived automatically, the same
# way real M3 tonal palettes work (see deriveLightRole/deriveDarkRole in
# src/theme.ts). Everything below spells out the exact light/dark values
# instead, because that's what the hand-designed field guide (M5's starting
# point) settled on — but you can delete a role's `light`/`dark` blocks and
# keep just its `seed` to fall back to the auto-derived look.

neutralHue: 275 # tints every surface/outline tone; the field guide's "warm-violet neutral"

colors:
  primary: # Ink — links, caret, primary actions
    seed: { l: 52, c: 0.19, h: 275 }
    light:
      on: { l: 99, c: 0.004, h: 275 }
      container: { l: 89, c: 0.045, h: 275 }
      onContainer: { l: 24, c: 0.10, h: 275 }
    dark:
      base: { l: 80, c: 0.13, h: 275 }
      on: { l: 22, c: 0.09, h: 275 }
      container: { l: 32, c: 0.11, h: 275 }
      onContainer: { l: 90, c: 0.05, h: 275 }

  secondary: # Moss — backlinks, quiet UI
    seed: { l: 58, c: 0.08, h: 175 }
    light:
      on: { l: 99, c: 0.004, h: 175 }
      container: { l: 90, c: 0.035, h: 175 }
      onContainer: { l: 25, c: 0.055, h: 175 }
    dark:
      base: { l: 78, c: 0.07, h: 175 }
      on: { l: 24, c: 0.04, h: 175 }
      container: { l: 30, c: 0.045, h: 175 }
      onContainer: { l: 90, c: 0.03, h: 175 }

  tertiary: # Ember — tags, accents
    seed: { l: 68, c: 0.15, h: 55 }
    light:
      on: { l: 21, c: 0.02, h: 55 }
      container: { l: 90, c: 0.06, h: 55 }
      onContainer: { l: 29, c: 0.09, h: 55 }
    dark:
      base: { l: 80, c: 0.12, h: 55 }
      on: { l: 26, c: 0.06, h: 55 }
      container: { l: 34, c: 0.08, h: 55 }
      onContainer: { l: 91, c: 0.05, h: 55 }

  error:
    seed: { l: 55, c: 0.20, h: 25 }
    light:
      on: { l: 99, c: 0.004, h: 25 }
      container: { l: 91, c: 0.05, h: 25 }
      onContainer: { l: 27, c: 0.12, h: 25 }
    dark:
      base: { l: 78, c: 0.16, h: 25 }
      on: { l: 24, c: 0.08, h: 25 }
      container: { l: 33, c: 0.10, h: 25 }
      onContainer: { l: 90, c: 0.05, h: 25 }

fonts:
  display: '"Fraunces", "Iowan Old Style", ui-serif, Georgia, serif'
  body: '"Manrope", "Segoe UI", system-ui, sans-serif'
  source: '"IBM Plex Mono", "SF Mono", ui-monospace, monospace'

# The 15 fixed M3 type-scale roles (display/headline/title/body/label × L/M/S).
# `font` picks one of the three families above. Omit any role to keep its
# default size/weight/line-height.
type:
  display-l: { font: display, size: 3.2rem, lineHeight: 1.05, weight: 400 }
  display-m: { font: display, size: 2.5rem, lineHeight: 1.1, weight: 400 }
  display-s: { font: display, size: 2rem, lineHeight: 1.15, weight: 400 }
  headline-l: { font: display, size: 1.75rem, lineHeight: 1.2, weight: 500 }
  headline-m: { font: display, size: 1.55rem, lineHeight: 1.25, weight: 500 }
  headline-s: { font: display, size: 1.3rem, lineHeight: 1.3, weight: 500 }
  title-l: { font: body, size: 1.2rem, lineHeight: 1.3, weight: 700 }
  title-m: { font: body, size: 1rem, lineHeight: 1.4, weight: 700 }
  title-s: { font: body, size: 0.85rem, lineHeight: 1.35, weight: 700 }
  body-l: { font: body, size: 1rem, lineHeight: 1.55, weight: 400 }
  body-m: { font: body, size: 0.875rem, lineHeight: 1.5, weight: 400 }
  body-s: { font: body, size: 0.75rem, lineHeight: 1.4, weight: 400 }
  label-l: {
    font: body,
    size: 0.875rem,
    lineHeight: 1.3,
    weight: 600,
    letterSpacing: 0.01em,
  }
  label-m: {
    font: body,
    size: 0.75rem,
    lineHeight: 1.3,
    weight: 600,
    letterSpacing: 0.02em,
  }
  label-s: {
    font: body,
    size: 0.6875rem,
    lineHeight: 1.3,
    weight: 600,
    letterSpacing: 0.03em,
  }

# The fixed M3 corner scale, none -> full.
shape:
  none: 0px
  xs: 0.25rem
  sm: 0.5rem
  md: 0.75rem
  lg: 1rem
  xl: 1.75rem
  full: 999px

# Exactly two named schemes (spec.md §12) — not user-definable beyond these.
# Expressive is reserved for the one primary action per screen ("New note");
# Standard is everything else (save/close/navigate).
motion:
  expressive: { duration: 450ms, easing: "cubic-bezier(0.34, 1.56, 0.64, 1)" }
  standard: { duration: 220ms, easing: "cubic-bezier(0.2, 0, 0, 1)" }

# A small, bounded set of placements — not a general layout engine.
layout:
  fabPlacement: bottom-right # or: bottom-left
  density: comfortable # or: compact
  showSearchNav: true
  showTagsNav: true
